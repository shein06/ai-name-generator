<script>
    // --- GATEWAY ENGINE CONTROLLER ---
    let countdownVal = 5; // Countdown duration in seconds
    let downloadUrl = "";
    let fileName = "document.pdf";

    // 1. Parse incoming parameters safely from URL
    function parseParameters() {
        const urlParams = new URLSearchParams(window.location.search);
        const encodedUrl = urlParams.get('url');
        const rawName = urlParams.get('name');

        if (!encodedUrl) {
            // Prevent redirection crash on blob: URLs or iframe sandbox previews
            if (window.location.protocol === 'blob:' || !window.location.host) {
                console.log("Running in sandbox/preview. Initializing with mock values.");
                downloadUrl = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500"; // Mock image URL
                fileName = "demo_document.jpg";
                document.getElementById('fileNameDisplay').textContent = fileName + " (Preview Demo)";
                setFileIcon(fileName);
                return;
            }
            
            // Fallback redirect for production wrapped safely
            try {
                window.location.replace("index.html");
            } catch (e) {
                console.error("Redirect blocked or failed:", e);
            }
            return;
        }

        // Decode URL safe strings
        downloadUrl = decodeURIComponent(encodedUrl);
        if (rawName) {
            fileName = decodeURIComponent(rawName);
        }

        document.getElementById('fileNameDisplay').textContent = fileName;
        setFileIcon(fileName);
    }

    // 2. Set beautiful file icon dynamically based on extension
    function setFileIcon(name) {
        const iconEl = document.getElementById('fileIcon');
        const ext = name.split('.').pop().toLowerCase();

        if (['pdf'].includes(ext)) iconEl.textContent = "📕";
        else if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) iconEl.textContent = "🖼️";
        else if (['mp4', 'avi', 'mov', 'mkv'].includes(ext)) iconEl.textContent = "🎬";
        else if (['zip', 'rar', '7z', 'tar'].includes(ext)) iconEl.textContent = "📦";
        else if (['txt', 'doc', 'docx'].includes(ext)) iconEl.textContent = "📄";
        else iconEl.textContent = "💾";
    }

    // 3. System countdown timer trigger
    function startCountdown() {
        const timerEl = document.getElementById('timer');
        const progressEl = document.getElementById('progressBar');
        const totalDuration = countdownVal;

        const interval = setInterval(() => {
            countdownVal--;
            timerEl.textContent = countdownVal;

            // Animate progress bar down
            const percentage = (countdownVal / totalDuration) * 100;
            progressEl.style.width = `${percentage}%`;

            if (countdownVal <= 0) {
                clearInterval(interval);
                revealDownloadButton();
            }
        }, 1000);
    }

    // 4. Reveal real secure download triggers
    function revealDownloadButton() {
        document.getElementById('statusWrapper').style.display = "none";
        document.getElementById('actionWrapper').style.display = "block";
        
        // Setup direct & backup hyperlinks
        document.getElementById('backupLink').href = downloadUrl;
        document.getElementById('backupLink').download = fileName;

        // Auto trigger download
        startFileDownload();
    }

    // 5. Execute file stream transfer download safely
    function startFileDownload() {
        if (!downloadUrl) return;

        const tempLink = document.createElement('a');
        tempLink.href = downloadUrl;
        tempLink.download = fileName;
        tempLink.target = "_blank"; // Cross-origin safety trigger
        document.body.appendChild(tempLink);
        tempLink.click();
        document.body.removeChild(tempLink);
    }

    // Initialize triggers on window load
    window.addEventListener('DOMContentLoaded', () => {
        // Force dark mode matching browser theme preferences automatically
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.setAttribute('data-theme', 'dark');
        }
        
        parseParameters();
        startCountdown();
    });
</script>
