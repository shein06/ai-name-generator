<script>
    // Global parameters to manage download file details
    let downloadUrl = "";
    let fileName = "Your File";
    let isDemoMode = false;
    let isIndexedDBMode = false;
    let localBlobFile = null;
    let countdownValue = 5;
    let countdownTimer;

    // Parse incoming parameters from URL safely
    function parseParameters() {
        const urlParams = new URLSearchParams(window.location.search);
        const sourceMode = urlParams.get('source');
        downloadUrl = urlParams.get('url') || urlParams.get('file');
        fileName = urlParams.get('name') || "secure_document.pdf";

        // Handle fallback if running in preview environment (blob: / local sandbox)
        if (window.location.protocol === 'blob:' || (!downloadUrl && sourceMode !== 'indexeddb')) {
            isDemoMode = true;
            downloadUrl = "#";
            fileName = "demo_omnitools_document.pdf";
            console.log("Demo Mode Activated: Sandbox Environment Detected.");
        }

        // Handle local files generated from tool pages (stored via IndexedDB)
        if (sourceMode === 'indexeddb') {
            isIndexedDBMode = true;
            retrieveLocalFile();
        }

        // Display updated file name on UI
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        if (fileNameDisplay) {
            fileNameDisplay.textContent = fileName;
        }

        // Match dynamic icon representing extension
        const fileIcon = document.getElementById('fileIcon');
        if (fileIcon) {
            const ext = fileName.split('.').pop().toLowerCase();
            if (['zip', 'rar', '7z'].includes(ext)) fileIcon.textContent = "📦";
            else if (['jpg', 'jpeg', 'png', 'gif', 'svg', 'webp'].includes(ext)) fileIcon.textContent = "🖼️";
            else if (['mp4', 'avi', 'mkv', 'mov'].includes(ext)) fileIcon.textContent = "🎬";
            else if (['mp3', 'wav', 'ogg'].includes(ext)) fileIcon.textContent = "🎵";
            else if (['pdf'].includes(ext)) fileIcon.textContent = "📕";
            else fileIcon.textContent = "📄";
        }

        // Configure fallback backup link
        const backupLink = document.getElementById('backupLink');
        if (backupLink) {
            backupLink.href = downloadUrl;
            backupLink.addEventListener('click', (e) => {
                if (isDemoMode) {
                    e.preventDefault();
                    triggerDemoDownload();
                } else if (isIndexedDBMode) {
                    e.preventDefault();
                    triggerIndexedDBDownload();
                }
            });
        }
    }

    // Retrieve local blob from IndexedDB (so PDF tools don't break upon page redirect)
    function retrieveLocalFile() {
        const dbRequest = indexedDB.open("OmniToolsDownloads", 1);
        dbRequest.onsuccess = (e) => {
            const db = e.target.result;
            const tx = db.transaction("files", "readonly");
            const storeRequest = tx.objectStore("files").get("pending_file");
            storeRequest.onsuccess = () => {
                if (storeRequest.result) {
                    localBlobFile = storeRequest.result;
                    console.log("Locally stored file retrieved from memory successfully.");
                } else {
                    console.error("Local file expired or not found.");
                }
            };
        };
    }

    // Initialize and run secure progress countdown timer
    function startCountdown() {
        const timerElement = document.getElementById('timer');
        const progressBar = document.getElementById('progressBar');
        const statusWrapper = document.getElementById('statusWrapper');
        const actionWrapper = document.getElementById('actionWrapper');

        if (!timerElement || !progressBar) return;

        progressBar.style.width = '100%';

        countdownTimer = setInterval(() => {
            countdownValue--;
            timerElement.textContent = countdownValue;
            
            // Adjust progress bar percentage
            const percent = (countdownValue / 5) * 100;
            progressBar.style.width = `${percent}%`;

            if (countdownValue <= 0) {
                clearInterval(countdownTimer);
                
                // Hide loader, show action button
                if (statusWrapper) statusWrapper.style.display = 'none';
                if (actionWrapper) actionWrapper.style.display = 'block';

                // Automatically trigger file download
                startFileDownload();
            }
        }, 1000);
    }

    // Trigger file download
    function startFileDownload() {
        if (isDemoMode) {
            triggerDemoDownload();
            return;
        }
        if (isIndexedDBMode) {
            triggerIndexedDBDownload();
            return;
        }

        // Create virtual DOM element to cleanly download original file
        const link = document.createElement('a');
        link.href = downloadUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Download locally cached file from memory
    function triggerIndexedDBDownload() {
        if (!localBlobFile) {
            console.error("No cached file in database.");
            return;
        }
        const tempUrl = URL.createObjectURL(localBlobFile);
        const link = document.createElement('a');
        link.href = tempUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(tempUrl);
    }

    // Generate safe mock file download when tested in preview workspace
    function triggerDemoDownload() {
        const dummyText = "Thank you for using OmniTools AI Secure File Downloader!\nThis is a simulated download to prove the redirect and gateway logic works seamlessly inside the sandbox preview.";
        const blob = new Blob([dummyText], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement('a');
        link.href = url;
        link.download = "simulated_omnitools_document.txt";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        
        console.log("Simulated file successfully downloaded inside Sandbox Environment.");
    }

    // Initialize triggers on window load
    window.addEventListener('DOMContentLoaded', () => {
        // Force dark mode matching browser theme preferences automatically
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.setAttribute('data-theme', 'dark');
        }
        
        parseParameters();
        startCountdown();
    });
</script>
